name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly timer for the heavy verification jobs (fuzz run, ThreadSanitizer)
  # that are too slow to gate every PR.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Least privilege by default: no job may write to the repo unless it re-declares
# a narrower scope. Every `uses:` below is pinned to a 40-char commit SHA (with
# the human-readable version in the trailing comment); dependabot proposes bumps.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Clippy runs on a pinned toolchain so a new Rust release cannot turn main red
  # without a code change. New lints are a style gate for this repo only: clippy
  # never runs on a consumer's machine, and `[workspace.lints]` is capped to
  # `allow` when monocoque is built as a dependency, so a pin costs no
  # user-facing signal. Real compiler breakage is caught by the test job (latest
  # stable) and the non-gating `future-toolchain` job (beta) below. Bump this
  # deliberately when `future-toolchain` reports new lints.
  CLIPPY_TOOLCHAIN: "1.98"

jobs:
  test:
    name: Test (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runtime backends are mutually exclusive, so each is tested in its own
      # matrix leg with the same full-workspace command, differing only by the
      # feature flags that select the backend.
      matrix:
        backend:
          - { name: compio, flags: "--features zmq" }
          - { name: tokio, flags: "--no-default-features --features runtime-tokio,zmq" }
          - { name: smol, flags: "--no-default-features --features runtime-smol,zmq" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Run tests (${{ matrix.backend.name }} backend)
        run: cargo test --workspace ${{ matrix.backend.flags }}

  clippy:
    name: Clippy (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Same per-backend split as the test job. Every target (lib, tests,
      # benches, examples) is backend-agnostic, so all three legs lint the
      # identical `--all-targets` set, differing only by the backend feature.
      matrix:
        backend:
          - { name: compio, flags: "--all-targets --features zmq" }
          - { name: tokio, flags: "--all-targets --no-default-features --features runtime-tokio,zmq" }
          - { name: smol, flags: "--all-targets --no-default-features --features runtime-smol,zmq" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Clippy (${{ matrix.backend.name }} backend)
        run: cargo clippy --workspace ${{ matrix.backend.flags }} -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The workspace declares a single MSRV of 1.95: the crates support all
      # three backends behind features, so they carry one `rust-version`, and the
      # default compio backend floors it at 1.95 (compio-driver uses cfg_select).
      # Cargo enforces that declared version for every build, so the tokio and
      # smol backends are checked on 1.95 too. Each leg builds with `--features
      # zmq` so the ZMTP protocol + ZMQ pattern API - the thing users actually
      # compile - is covered, not just the bare core.
      matrix:
        leg:
          - { name: "compio 1.95", toolchain: "1.95", flags: "--features zmq" }
          - { name: "tokio 1.95", toolchain: "1.95", flags: "--no-default-features --features runtime-tokio,zmq" }
          - { name: "smol 1.95", toolchain: "1.95", flags: "--no-default-features --features runtime-smol,zmq" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.leg.toolchain }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build on MSRV (${{ matrix.leg.name }})
        run: cargo build --workspace ${{ matrix.leg.flags }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check docs (no warnings)
        run: cargo doc --no-deps --workspace --features zmq
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Runs against the committed Cargo.lock - the exact graph we ship - not a
      # freshly-floated resolution.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  deny:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # advisories + licenses + bans + sources, per deny.toml, against the lock.
      - name: cargo deny check
        run: cargo deny check

  future-toolchain:
    name: Future toolchain (beta, non-gating)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Beta is roughly six weeks ahead of stable, so a real break shows up here
    # before any user on stable can hit it. Reported for visibility only: an
    # upcoming-compiler problem is something to schedule, not something that
    # should block a PR that did not cause it. Clippy runs too, unpinned, so the
    # next release's lints are known before `CLIPPY_TOOLCHAIN` is bumped.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: compio, flags: "--features zmq" }
          - { name: tokio, flags: "--no-default-features --features runtime-tokio,zmq" }
          - { name: smol, flags: "--no-default-features --features runtime-smol,zmq" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test on beta (${{ matrix.backend.name }} backend)
        run: cargo test --workspace ${{ matrix.backend.flags }}
      - name: Clippy on beta (${{ matrix.backend.name }} backend)
        run: cargo clippy --workspace --all-targets ${{ matrix.backend.flags }} -- -D warnings

  coverage:
    name: Coverage (llvm-cov, non-gating)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Reported for visibility; a coverage dip does not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect coverage (compio backend)
        run: cargo llvm-cov --workspace --features zmq --summary-only

  fuzz-build:
    name: Fuzz Targets (build only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir monocoque-fuzz

  miri:
    name: Miri (unsafe buffer/codec bookkeeping)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Miri proves the owned-buffer unsafe in io.rs (set_buf_init /
      # take_read_buffer) and the buffer/codec byte bookkeeping are sound. The
      # IO-dependent unsafe (tcp from_raw_fd, the inproc_stream cross-await
      # pointer) needs a real runtime/syscalls and cannot run under Miri.
      - name: Miri (core io + buffer)
        run: "cargo miri test -p monocoque-rs-core --lib -- io:: buffer::"
      - name: Miri (zmtp codec)
        run: "cargo miri test -p monocoque-rs-zmtp --lib -- codec::"

  loom:
    name: Loom (publisher atomic orderings)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Standalone crate so --cfg loom reaches only loom, not the flume /
      # concurrent-queue deps of the real crates.
      - name: Loom model tests
        run: cargo test --manifest-path monocoque-loom/Cargo.toml
        env:
          RUSTFLAGS: "--cfg loom"

  fuzz-run:
    name: Fuzz Targets (run)
    permissions:
      contents: read
    # Timed run, too slow for every PR: nightly schedule + manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each fuzz target (60s)
        run: |
          set -euo pipefail
          for t in fuzz_decoder fuzz_frame_codec fuzz_security_plain \
                   fuzz_subscription_trie fuzz_curve_handshake \
                   fuzz_greeting fuzz_command fuzz_zap_request; do
            echo "::group::$t"
            cargo fuzz run --fuzz-dir monocoque-fuzz "$t" -- \
              -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  tsan:
    name: ThreadSanitizer (core handoffs)
    permissions:
      contents: read
    # Rebuilds std with -Zbuild-std; scheduled + manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # ThreadSanitizer over the core crate's thread/channel handoffs
      # (byte-backpressure Condvar, flume monitor/hub channels). Run on the
      # tokio backend because TSan cannot instrument compio's io_uring path.
      - name: cargo test under ThreadSanitizer
        run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p monocoque-rs-core --no-default-features
          --features runtime-tokio --lib
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "halt_on_error=1"
