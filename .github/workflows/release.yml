name: Release

# Tag-triggered publish. Push an annotated tag `vX.Y.Z` on a green commit and this
# verifies the workspace version matches the tag, then publishes the three crates
# in dependency order (core -> zmtp -> monocoque-rs). Requires the repository
# secret CARGO_REGISTRY_TOKEN.
#
# Backfill note: v0.3.0 predates this workflow. To register the historical
# release, push the tag `v0.3.0` on commit c7d7ead once (crates already on
# crates.io are skipped by the publish step's --dry-run check below).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    name: Verify version and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2

      - name: Verify workspace version matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ws=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          echo "tag=$tag workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag v$tag does not match workspace version $ws"
            exit 1
          fi

      - name: Publish monocoque-rs-core
        run: cargo publish -p monocoque-rs-core --features zmq
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish monocoque-rs-zmtp
        run: cargo publish -p monocoque-rs-zmtp --features zmq
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish monocoque-rs
        run: cargo publish -p monocoque-rs --features zmq
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
