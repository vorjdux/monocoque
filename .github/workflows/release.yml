name: Release

# Tag-triggered publish. Push an annotated tag `vX.Y.Z` on a green commit and this
# verifies the workspace version matches the tag, then publishes the three crates
# in dependency order (core -> zmtp -> monocoque-rs). Requires the repository
# secret CARGO_REGISTRY_TOKEN.
#
# Publishing is idempotent per crate: each step asks crates.io whether this
# version is already up and skips it if so. That makes a re-run safe after a
# partial failure, where an earlier crate uploaded and a later one did not.
#
# Backfill note: v0.3.0 predates this workflow. To register the historical
# release, push the tag `v0.3.0` on commit c7d7ead once; crates already on
# crates.io are skipped rather than failing the run.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  # crates.io rejects API requests that carry no identifying User-Agent (403),
  # which would otherwise make every "is it already published" probe look like
  # a miss and turn the skip guard into a no-op.
  UA: "monocoque-release-ci (https://github.com/vorjdux/monocoque)"

jobs:
  publish:
    name: Verify version and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Verify workspace version matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ws=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          echo "tag=$tag workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag v$tag does not match workspace version $ws"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      # `zmq` is a feature of monocoque-rs only: it is what compiles the ZMTP
      # protocol and the ZeroMQ pattern API on top of the chassis. The two lower
      # crates have no such feature (their features select a runtime backend),
      # so passing it to them fails the publish before anything is uploaded.
      # Each crate is verified on its own default features; --locked keeps the
      # verification build on the committed lock rather than a fresh resolve.
      - name: Publish monocoque-rs-core
        run: |
          set -euo pipefail
          if curl -sf -A "$UA" "https://crates.io/api/v1/crates/monocoque-rs-core/$VERSION" >/dev/null; then
            echo "monocoque-rs-core $VERSION is already on crates.io, skipping"
          else
            cargo publish -p monocoque-rs-core --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish monocoque-rs-zmtp
        run: |
          set -euo pipefail
          if curl -sf -A "$UA" "https://crates.io/api/v1/crates/monocoque-rs-zmtp/$VERSION" >/dev/null; then
            echo "monocoque-rs-zmtp $VERSION is already on crates.io, skipping"
          else
            cargo publish -p monocoque-rs-zmtp --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish monocoque-rs
        run: |
          set -euo pipefail
          if curl -sf -A "$UA" "https://crates.io/api/v1/crates/monocoque-rs/$VERSION" >/dev/null; then
            echo "monocoque-rs $VERSION is already on crates.io, skipping"
          else
            cargo publish -p monocoque-rs --locked --features zmq
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
