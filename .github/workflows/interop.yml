name: Interop Tests (libzmq)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interop-rust:
    name: Rust interop tests (monocoque - libzmq)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run Rust interop tests
        run: |
          cargo test -p monocoque-rs \
            --features zmq \
            --test interop_pair \
            --test interop_pubsub \
            --test interop_router \
            --test interop_load_balance \
            --test interop_push_pull \
            --test interop_req_rep \
            --test interop_plain \
            --test interop_stream \
            --test interop_curve

  interop-python:
    name: Python interop tests (pyzmq - monocoque)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libzmq and Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y libzmq3-dev
          pip install pyzmq pytest pytest-timeout
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build the interop example binaries (debug, with zmq)
        # The Python tests drive these prebuilt debug binaries from
        # target/debug/examples, so build exactly those with the zmq feature.
        run: >
          cargo build -p monocoque-rs --features zmq
          --example simple_req_client --example simple_rep_server
          --example sub_client --example pub_server
      # The `|| echo skipping` mask is removed: this job now fails honestly when a
      # Python interop test fails, per the Phase 0 gate. The tests drive the built
      # examples themselves and do not need a manually-started server.
      - name: Run Python interop tests
        working-directory: interop_tests
        run: |
          python3 -m pytest test_req_rep_interop.py \
                            test_pub_sub_interop.py \
                            -v --timeout=30
