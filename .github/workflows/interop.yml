name: Interop Tests (libzmq)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interop-rust:
    name: Rust interop tests (monocoque - libzmq)
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Run Rust interop tests
        run: |
          cargo test -p monocoque-rs \
            --features zmq \
            --test interop_pair \
            --test interop_pubsub \
            --test interop_router \
            --test interop_push_pull \
            --test interop_req_rep \
            --test interop_plain \
            --test interop_stream \
            --test interop_heartbeat \
            --test interop_curve

  interop-python:
    name: Python interop tests (pyzmq - monocoque)
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pyzmq brings its own libzmq. The version is pinned so the libzmq the
      # docs name (4.3.5) is the one tested; the check fails the job if a new
      # pin brings another.
      - name: Install Python deps
        run: |
          pip install pyzmq==27.1.0 pytest pytest-timeout
          python3 -c "import zmq; print('libzmq', zmq.zmq_version()); assert zmq.zmq_version() == '4.3.5'"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Build the interop example binaries (debug, with zmq)
        # The Python tests drive these prebuilt debug binaries from
        # target/debug/examples, so build exactly those with the zmq feature.
        run: >
          cargo build -p monocoque-rs --features zmq
          --example simple_req_client --example simple_rep_server
          --example sub_client --example pub_server
          --example curve_echo
      # The job fails when any Python interop test fails. The tests drive the
      # built examples themselves and do not need a manually-started server.
      - name: Run Python interop tests
        working-directory: interop_tests
        run: |
          python3 -m pytest test_req_rep_interop.py \
                            test_pub_sub_interop.py \
                            test_curve_interop.py \
                            -v --timeout=30
